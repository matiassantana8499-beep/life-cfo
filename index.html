<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life CFO">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Life CFO</title>
<style>
:root{
  --bg:#06070b;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.075);--line:rgba(255,255,255,.08);
  --text:#f5f7fc;--muted:#8b91a5;--accent:#6a7dff;--accent2:#b05cff;--cyan:#38e1ff;
  --red:#ff5d73;--amber:#ffb547;--green:#2ee59d;--blue:#4fb3ff;--violet:#b583ff;
  --grad:linear-gradient(135deg,#4f7cff 0%,#8b5bff 55%,#d45cff 100%);
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background:transparent;padding:calc(env(safe-area-inset-top) + 6px) 0 calc(env(safe-area-inset-bottom) + 112px);font-variant-numeric:tabular-nums}
/* ambient background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;animation:float 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:520px;height:520px;background:radial-gradient(circle,rgba(70,90,255,.55),transparent 65%);top:-260px;left:-200px}
.bg i:nth-child(2){width:460px;height:460px;background:radial-gradient(circle,rgba(170,70,255,.42),transparent 65%);top:-200px;right:-220px;animation-duration:28s}
.bg i:nth-child(3){width:420px;height:420px;background:radial-gradient(circle,rgba(0,190,255,.16),transparent 65%);top:420px;left:-220px;animation-duration:34s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;gap:8px}
header h1{font-size:26px;margin:0;letter-spacing:-.6px;font-weight:750;flex:1}
.month{display:flex;align-items:center;gap:4px;color:var(--text);font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:3px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.month span{padding:0 4px;min-width:64px;text-align:center}
.hbtn{background:var(--card);border:1px solid var(--line);color:var(--text);min-width:34px;height:34px;border-radius:50%;font-size:16px;display:grid;place-items:center;padding:0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.month .hbtn{min-width:28px;height:28px;border:0;background:var(--card2)}
main{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
h2{font-size:17px;letter-spacing:-.2px;color:var(--text);margin:24px 4px 10px;font-weight:700}
h2 .muted{font-weight:500;font-size:13px}
/* hero */
.hero{text-align:center;padding:22px 4px 8px}
.hero-label{font-size:13px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:30px}
.hero-num{font-size:52px;font-weight:750;letter-spacing:-2px;margin:14px 0 2px;line-height:1}
.hero-num small,.money small{font-size:.5em;letter-spacing:-.5px;opacity:.75}
.hero-sub{color:var(--muted);font-size:13.5px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.actions{display:flex;justify-content:center;gap:22px;margin:24px 0 8px}
.act{background:none;border:0;color:var(--text);font:inherit;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0}
.act i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-style:normal;transition:transform .15s}
.act:active i{transform:scale(.92)}
.act.primary i{background:var(--grad);border:0;box-shadow:0 8px 24px rgba(110,90,255,.45)}
.act svg{width:22px;height:22px}
/* score */
.score{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ring span{width:62px;height:62px;border-radius:50%;background:#0c0e15;display:grid;place-items:center;font-size:22px;font-weight:750}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi b{display:block;font-size:19px;margin-top:3px;letter-spacing:-.4px}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .kpi{flex:none;min-width:132px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.big{font-size:40px;font-weight:750;letter-spacing:-1.5px;line-height:1.1}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%;border-radius:6px;background:var(--grad)}
/* briefing */
.flag{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}
.flag:first-child{border-top:0;padding-top:0}
.flag:last-child{padding-bottom:0}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ico.red{background:rgba(255,93,115,.14);color:var(--red)}.ico.amber{background:rgba(255,181,71,.14);color:var(--amber)}.ico.green{background:rgba(46,229,157,.13);color:var(--green)}.ico.blue{background:rgba(79,179,255,.14);color:var(--blue)}.ico.violet{background:rgba(181,131,255,.15);color:var(--violet)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.red{background:var(--red)}.amber{background:var(--amber)}.green{background:var(--green)}.blue{background:var(--blue)}.violet{background:var(--violet)}
.ico.red,.ico.amber,.ico.green,.ico.blue,.ico.violet{background-clip:padding-box}
.flag b{display:block;font-weight:650;margin-bottom:1px}
/* list rows with avatars */
.cat,.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cat:first-child,.tx:first-child{border-top:0;padding-top:0}
.cat:last-child,.tx:last-child{padding-bottom:0}
.cat .grow,.tx .grow{flex:1;min-width:0}
.tx .grow>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:19px;border:1px solid transparent}
.amt-r{text-align:right;font-weight:650;white-space:nowrap}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(122,110,255,.7);box-shadow:0 0 0 4px rgba(122,110,255,.15)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
option{background:#151824}
textarea{min-height:140px;font-size:14px}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:500}
.btn{display:inline-block;background:var(--grad);color:#fff;border:0;border-radius:16px;padding:14px 16px;font:inherit;font-weight:650;width:100%;margin-top:12px;text-align:center;box-shadow:0 8px 24px rgba(110,90,255,.3);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,93,115,.3);box-shadow:none}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2>*,.grid3>*{min-width:0}
input[type=month],input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.pos{color:var(--green)}.neg{color:var(--red)}
/* floating nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(18,20,30,.72);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.09);border-radius:28px;display:flex;padding:7px 4px;z-index:5;box-shadow:0 12px 40px rgba(0,0,0,.5)}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:10px;font-weight:600;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:20px;transition:color .2s,background .2s}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff;background:rgba(255,255,255,.07)}
nav button.on svg{stroke:url(#ng);filter:drop-shadow(0 0 6px rgba(140,110,255,.6))}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;border:0;font-size:28px;font-weight:300;box-shadow:0 10px 30px rgba(120,90,255,.55);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:10}
.sheet.open{display:flex;animation:fade .2s}
.sheet .panel{background:#10121a;border:1px solid var(--line);border-bottom:0;width:100%;border-radius:28px 28px 0 0;padding:26px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto;position:relative;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .panel::before{content:"";position:absolute;top:9px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(255,255,255,.18)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.06);border-radius:16px;padding:4px}
.seg button{background:none;border:0;color:var(--muted);padding:10px 4px;border-radius:12px;font:inherit;font-weight:650;font-size:13.5px}
.seg button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.amt{font-size:40px!important;font-weight:750;text-align:center;letter-spacing:-1px;background:transparent!important;border:0!important;box-shadow:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 14px);background:rgba(30,33,48,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:30px;font-size:14px;font-weight:550;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
a{color:#9aa8ff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600;font-size:12px;border-top:0}
td:first-child,th:first-child{text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:30px;padding:9px 14px;font:inherit;font-size:13px;font-weight:550;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.msg{padding:12px 15px;border-radius:20px;margin-bottom:10px;max-width:92%}
.msg.u{background:var(--grad);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.msg.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.msg.a h3,.msg.a h4{margin:10px 0 4px;font-size:15px}.msg.a p{margin:6px 0}.msg.a ul{margin:6px 0;padding-left:20px}
.composer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:4;display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 8px;background:rgba(16,18,27,.92);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.1);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.composer textarea{flex:1;min-height:44px;max-height:120px;height:44px;padding:11px 0;border:0;border-radius:0;background:transparent;resize:none;font-size:16px;line-height:1.4;box-shadow:none!important}
.composer button{width:44px;height:44px;margin:0;padding:0;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:0 6px 18px rgba(110,90,255,.45)}
#chat{padding-bottom:84px}
#chat.has-thumbs{padding-bottom:160px}
.attach{width:40px;height:44px;flex:none;background:none;border:0;color:var(--muted);display:grid;place-items:center;padding:0;margin-left:-4px}
.attach svg{width:22px;height:22px}
.thumbs{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 152px);display:none;gap:8px;z-index:4}
.thumbs div{position:relative;width:62px;height:62px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.15);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:20px;padding:0}
.rv{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:0}
.rv input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:#8b5bff}
.rv select{padding:8px 10px;font-size:14px;margin-top:6px;border-radius:10px}
.rv .grow{flex:1;min-width:0}
.chatmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin:-4px 2px 12px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--muted)}
svg.chart text{fill:var(--muted);font-size:10px}
.glow{position:relative;overflow:hidden}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(120,130,255,.6),rgba(200,90,255,.15) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a8bff"/><stop offset="1" stop-color="#d45cff"/></linearGradient></defs></svg>
<header>
  <h1 id="title">Life CFO</h1>
  <div class="month"><button class="hbtn" id="mPrev" aria-label="Previous month">‹</button><span id="mLabel"></span><button class="hbtn" id="mNext" aria-label="Next month">›</button></div>
  <button class="hbtn" id="gear" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add transaction">+</button>
<nav id="nav">
  <button data-v="cfo" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>CFO</button>
  <button data-v="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Budget</button>
  <button data-v="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Spending</button>
  <button data-v="wealth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Wealth</button>
  <button data-v="tax"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Tax</button>
  <button data-v="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>AI CFO</button>
</nav>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileCSV" accept=".csv,text/csv" hidden>
<input type="file" id="fileJSON" accept=".json,application/json" hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>

<script>
/* =========================================================
   STORAGE
   ========================================================= */
const KEY='lifecfo.v1';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const DEFAULT_CATS=[['Housing','need'],['Groceries','need'],['Bills & utilities','need'],['Transport','need'],['Health & fitness','need'],['Eating out','want'],['Going out & nightlife','want'],['Shopping','want'],['Subscriptions','want'],['Fun & travel','want'],['Other','want'],['Savings & investing','save']];
const DEFAULT_RULES=`# keyword = Category  (first match wins)
uber eats = Eating out
glovo = Eating out
just eat = Eating out
deliveroo = Eating out
restaurant = Eating out
restaurante = Eating out
cafe = Eating out
bar = Going out & nightlife
pub = Going out & nightlife
club = Going out & nightlife
discoteca = Going out & nightlife
ticketmaster = Going out & nightlife
fever = Going out & nightlife
mercadona = Groceries
carrefour = Groceries
lidl = Groceries
aldi = Groceries
consum = Groceries
dia = Groceries
netflix = Subscriptions
spotify = Subscriptions
disney = Subscriptions
hbo = Subscriptions
apple.com = Subscriptions
google = Subscriptions
prime = Subscriptions
chatgpt = Subscriptions
anthropic = Subscriptions
claude = Subscriptions
uber = Transport
cabify = Transport
bolt = Transport
renfe = Transport
repsol = Transport
cepsa = Transport
iberdrola = Bills & utilities
endesa = Bills & utilities
vodafone = Bills & utilities
movistar = Bills & utilities
orange = Bills & utilities
digi = Bills & utilities
pharmacy = Health & fitness
farmacia = Health & fitness
gym = Health & fitness
amazon = Shopping
zara = Shopping
ryanair = Fun & travel
vueling = Fun & travel
emirates = Fun & travel
booking = Fun & travel
airbnb = Fun & travel`;
function defaults(){return{v:2,
  settings:{currency:'EUR',income:0,savingsTarget:20,efMonths:6,lang:'en'},
  categories:DEFAULT_CATS.map(([name,kind])=>({id:uid(),name,kind,budget:0})),
  tx:[],accounts:[],rules:DEFAULT_RULES,
  goal:{target:0,date:'',coreReturn:8},
  alloc:{aggrPct:20,aggrIncome:250,aggrReturn:15},
  holdings:[],
  tax:{regime:'es',marginal:37,pensionYTD:0,moveDate:'',returnDate:''},
  taxlog:[],
  ai:{key:'',model:'claude-sonnet-5-5',web:true,allowTx:true,profile:'',profileUpdated:null,chat:[]},
  updated:null}}
let S;
function migrate(o){
  const D=defaults();
  if(!o||!Array.isArray(o.categories))return D;
  for(const k of Object.keys(D)){if(o[k]===undefined)o[k]=D[k];else if(D[k]&&typeof D[k]==='object'&&!Array.isArray(D[k]))o[k]={...D[k],...o[k]}}
  return o;
}
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=migrate(o)}

function tr(html){
  if(!ES_LANG()&&!TR_RECORD)return html;
  let inTA=false;
  return String(html).split(/(<(?:[^>"']|"[^"]*"|'[^']*')*>)/).map(part=>{
    if(part.startsWith('<')){
      if(/^<textarea/i.test(part))inTA=true;else if(/^<\/textarea/i.test(part))inTA=false;
      return part.replace(/(placeholder|aria-label)="([^"]*)"/g,(_,a,v)=>`${a}="${trText(v)}"`);
    }
    return inTA?part:trText(part);
  }).join('');
}

function stats(m){
  const C=catById(),tx=S.tx.filter(t=>t.date.slice(0,7)===m),byCat={};
  let inc=0,spent=0,saved=0,needs=0,wants=0,uncat=0;
  for(const t of tx){
    if(t.type==='income'){inc+=t.amount;continue}
    const c=C[t.cat];byCat[t.cat]=(byCat[t.cat]||0)+t.amount;
    if(!c){uncat+=t.amount;spent+=t.amount;wants+=t.amount;continue}
    if(c.kind==='save')saved+=t.amount;else{spent+=t.amount;c.kind==='need'?needs+=t.amount:wants+=t.amount}
  }
  const now=thisMonth(),isCur=m===now,dim=daysIn(m),day=isCur?new Date().getDate():dim,frac=Math.min(1,day/dim);
  let proj=0,projNeeds=0,projWants=0;const projCat={};
  for(const c of S.categories){
    if(c.kind==='save')continue;const sp=byCat[c.id]||0,b=+c.budget||0;let p=sp;
    if(isCur){p=c.kind==='need'?Math.max(sp,b):(frac>0.2?Math.max(sp,sp/frac):Math.max(sp,b))}
    projCat[c.id]=p;proj+=p;c.kind==='need'?projNeeds+=p:projWants+=p;
  }
  proj+=uncat;projWants+=uncat;
  const income=inc>0?inc:(+S.settings.income||0);
  return{tx,byCat,inc,income,spent,saved,needs,wants,uncat,isCur,dim,day,frac,proj,projNeeds,projWants,projCat,future:m>now};
}

  const cost=sum(S.holdings,h=>+h.cost||0),value=core+aggr;
  const aggrShare=value?aggr/value*100:0;
  // monthly saving capacity: avg of last 3 complete months with income, else plan
  const ms=[1,2,3].map(i=>stats(shiftMonth(thisMonth(),-i))).filter(s=>s.inc>0);
  let monthly=ms.length?sum(ms,s=>s.inc-s.spent)/ms.length:0;
  if(!ms.length){const planned=+S.settings.income||0,bud=sum(S.categories.filter(c=>c.kind!=='save'),c=>+c.budget||0);monthly=planned&&bud?planned-bud:0}
  const a=S.alloc,blended=((100-a.aggrPct)*(+S.goal.coreReturn||0)+a.aggrPct*(+a.aggrReturn||0))/100;
  return{cash,otherInv,debt,core,aggr,invested,nw,cost,value,aggrShare,monthly:Math.max(0,monthly),blended};
}
// Future value with monthly compounding on invested money, cash held flat
function fv(invested,cash,pmt,annual,n){const r=annual/100/12;const g=Math.pow(1+r,n);return invested*g+cash+(r?pmt*(g-1)/r:pmt*n)}
function goalPlan(){
  const W=wealth(),G=S.goal;if(!(+G.target>0)||!G.date)return null;
  const n=Math.max(1,monthsBetween(thisMonth(),G.date.slice(0,7)));
  const r=W.blended/100/12,g=Math.pow(1+r,n),k=r?(g-1)/r:n;
  const investedNet=W.invested-W.debt;
  const required=Math.max(0,(+G.target-W.cash-investedNet*g)/k);
  const projected=fv(investedNet,W.cash,W.monthly,W.blended,n);
  return{W,n,required,projected,onTrack:W.monthly>=required*0.98,gap:required-W.monthly};
}

/* =========================================================
   TAX ENGINE (Spain / Beckham / UAE). Figures checked Nov 2026.
   ========================================================= */
const ES_SAVINGS=[[6000,.19],[50000,.21],[200000,.23],[300000,.27],[Infinity,.30]];
const BECKHAM_SAVINGS=[[6000,.19],[50000,.21],[Infinity,.23]];
function prog(base,br){if(base<=0)return 0;let t=0,prev=0;for(const[cap,r]of br){if(base<=prev)break;t+=(Math.min(base,cap)-prev)*r;prev=cap}return t}
const REGIMES={es:'Spain (standard)',beckham:'Spain (Beckham)',uae:'UAE'};
function savingsTax(base,regime){return regime==='uae'?0:regime==='beckham'?prog(base,BECKHAM_SAVINGS):prog(base,ES_SAVINGS)}
function taxYear(y=thisYear()){
  const L=S.taxlog.filter(t=>t.date.slice(0,4)==String(y));
  const gains=sum(L.filter(t=>t.type==='gain'),t=>t.amount),div=sum(L.filter(t=>t.type==='dividend'),t=>t.amount),int=sum(L.filter(t=>t.type==='interest'),t=>t.amount);
  return{L,gains,div,int,base:gains+div+int};
}
function unrealised(){
  const rows=S.holdings.map(h=>({h,g:(+h.value||0)-(+h.cost||0)}));
  return{rows,gain:sum(rows.filter(r=>r.g>0),r=>r.g),loss:sum(rows.filter(r=>r.g<0),r=>-r.g)};
}
function movePlan(){
  const T=S.tax;if(!T.moveDate)return null;
  const[y,m]=T.moveDate.split('-').map(Number);
  const firstNR=m<=6?y:y+1; // Spain residence is per calendar year: >183 days in Spain = resident all year
  const beckhamYear=firstNR+5; // must be non-resident for the 5 tax years before the year you come back
  let ret=null;if(T.returnDate){const ry=+T.returnDate.slice(0,4);ret={year:ry,beckham:ry>=beckhamYear}}
  return{y,m,firstNR,beckhamYear,ret};
}

/* =========================================================
   THE CFO (rule engine)
   ========================================================= */
function cfo(m){
  const s=stats(m),P=stats(shiftMonth(m,-1)),set=S.settings,F=[];
  const add=(sev,title,detail)=>F.push({sev,title,detail});
  const spendCats=S.categories.filter(c=>c.kind!=='save');
  const totalBudget=sum(S.categories,c=>+c.budget||0),planned=+set.income||0;
  if(!S.tx.length&&!totalBudget&&!S.accounts.length&&!S.holdings.length){add('blue','Let’s get you set up','1) Settings (gear): add your monthly take-home pay. 2) Budget: set a limit per category. 3) Log spending with + or import your bank CSV. 4) Wealth: add balances, investments and a net worth goal. 5) AI CFO: paste your Claude API key.');return{F,s,score:null}}
  if(s.future){add('blue','Future month','Nothing to review yet. Your budget will apply here automatically.');return{F,s,score:null}}

  if(!planned)add('amber','No income set','Add your monthly take-home pay in Settings so I can judge your budget and savings rate.');
  if(planned&&totalBudget>planned)add('red','Your budget is bigger than your income',`Budgets total ${fmt(totalBudget)} against ${fmt(planned)} income. You need to cut ${fmt(totalBudget-planned)}.`);
  else if(planned&&totalBudget&&totalBudget<planned*0.95)add('blue','Money without a job',`${fmt(planned-totalBudget)} a month is not assigned. Unassigned money tends to get spent. Put it into Savings & investing.`);

  for(const c of spendCats){
    const sp=s.byCat[c.id]||0,b=+c.budget||0,p=s.projCat[c.id]||0;
    if(b>0&&sp>b)add('red',`${c.name} is over budget`,`${fmt(sp)} spent vs ${fmt(b)} (${Math.round(sp/b*100)}%).`);
    else if(b>0&&s.isCur&&c.kind!=='need'&&s.frac>0.2&&s.frac<0.97&&p>b*1.05){
      const left=Math.max(0,b-sp),days=s.dim-s.day+1;
      add('amber',`${c.name} is on pace to overspend`,`At this pace you land at ${fmt(p)} vs ${fmt(b)}. To stay on track: max ${fmt(left/days)} a day for the next ${days} days.`);
    } else if(!b&&sp>0)add('amber',`No budget for ${c.name}`,`${fmt(sp)} spent with no limit set.`);
    const prev=P.byCat[c.id]||0,cmp=s.isCur?p:sp;
    if(prev>0&&(!s.isCur||s.frac>0.4)&&cmp>prev*1.3&&cmp-prev>50)add('amber',`${c.name} is trending up`,`${s.isCur?'Heading for':'Ended at'} ${fmt(cmp)} vs ${fmt(prev)} last month (+${Math.round((cmp/prev-1)*100)}%).`);
  }
  if(s.uncat>0)add('amber','Uncategorised spending',`${fmt(s.uncat)} has no category. Tap those items in Spending, or let the AI CFO categorise them.`);

  if(s.income>0){
    const spend=s.isCur?s.proj:s.spent,rate=(s.income-spend)/s.income*100;
    if(rate<0)add('red','Spending more than you earn',`${s.isCur?'Projected':'Actual'} spend ${fmt(spend)} vs income ${fmt(s.income)}.`);
    else if(rate<set.savingsTarget)add('amber',`Savings rate ${Math.round(rate)}% (target ${set.savingsTarget}%)`,`Free up ${fmt(s.income*set.savingsTarget/100-(s.income-spend))} this month to hit target.`);
    else add('green',`Savings rate ${Math.round(rate)}%`,`On track vs your ${set.savingsTarget}% target. Make sure the surplus actually gets invested.`);
    const wantsPct=(s.isCur?s.projWants:s.wants)/s.income*100,needsPct=(s.isCur?s.projNeeds:s.needs)/s.income*100;
    if(wantsPct>30)add('amber',`Wants are ${Math.round(wantsPct)}% of income`,'Rule of thumb is about 30%. Eating out, going out, shopping and travel are where to look.');
    if(needsPct>55)add('amber',`Fixed costs are ${Math.round(needsPct)}% of income`,'Above ~50% leaves little room. Renegotiate housing, bills and transport once a year.');
    const sub=S.categories.find(c=>/subscri/i.test(c.name));
    if(sub){const sp=s.isCur?(s.projCat[sub.id]||0):(s.byCat[sub.id]||0);if(sp>s.income*0.03)add('amber','Subscription creep',`${fmt(sp)} a month (${fmt(sp*12)} a year). Cancel anything unused in the last 30 days.`)}
  }

  // Safety net
  const liquid=acc(['cash','savings']);
  let ess=sum(S.categories.filter(c=>c.kind==='need'),c=>+c.budget||0);
  if(!ess){const ms=[1,2,3].map(i=>stats(shiftMonth(m,-i)).needs).filter(x=>x>0);ess=ms.length?sum(ms)/ms.length:s.needs}
  if(!S.accounts.length)add('blue','Add your balances','Go to Wealth and add your current account, savings and any debts so I can check your safety net.');
  else if(ess>0){
    const target=ess*set.efMonths,cover=liquid/ess;
    if(liquid<target)add(cover<3?'red':'amber',`Safety net: ${cover.toFixed(1)} of ${set.efMonths} months`,`${fmt(target-liquid)} more in cash/savings covers ${set.efMonths} months of essentials (${fmt(ess)}/month). Build this before taking more investment risk.`);
    else{const idle=liquid-target-ess;
      if(idle>ess*0.5)add('blue','Idle cash opportunity',`About ${fmt(idle)} sits above your safety net plus a 1-month buffer. Inflation eats it. Invest it per your plan, or clear expensive debt first.`);
      else add('green',`Safety net funded (${cover.toFixed(1)} months)`,'New savings can go to investing and goals.');}
  }
  for(const a of S.accounts.filter(a=>a.type==='debt'&&+a.balance>0)){
    const r=+a.rate||0;
    if(r>=7)add('red',`Expensive debt: ${a.name} at ${r}%`,`${fmt(a.balance)} costs ~${fmt(a.balance*r/100)} a year. Paying it off is a guaranteed ${r}% return. Do it before investing.`);
    else if(!r)add('amber',`${a.name}: add the interest rate`,'Add the APR in Wealth so I can say whether to pay it off or invest.');
  }

  // Wealth and goal
  const gp=goalPlan();
  if(gp){
    if(gp.onTrack)add('green','Net worth goal on track',`You save ~${fmt(gp.W.monthly)}/month; you need ${fmt(gp.required)}. Projected ${fmt(gp.projected)} by ${monthName(S.goal.date.slice(0,7))}.`);
    else add('amber','Net worth goal off track',`You need ${fmt(gp.required)}/month invested but average ${fmt(gp.W.monthly)}. Gap: ${fmt(gp.gap)}/month. See Wealth for options.`);
  } else if(S.holdings.length||S.accounts.length)add('blue','Set a net worth goal','Wealth tab: pick a target and date and I will tell you what to invest each month.');
  const W=wealth();
  if(W.value>0&&Math.abs(W.aggrShare-S.alloc.aggrPct)>5)add('amber','Portfolio needs rebalancing',`High-risk bucket is ${pct(W.aggrShare)} vs your ${S.alloc.aggrPct}% target. ${W.aggrShare>S.alloc.aggrPct?'Take some profits into the core index fund.':'Direct new money to the high-risk bucket, or accept the drift.'}`);

  // Tax (Spain)
  const T=S.tax,mo=new Date().getMonth()+1;
  if(T.regime==='es'){
    const foreign=sum(S.holdings.filter(h=>h.foreign!==false),h=>+h.value||0);
    if(foreign>50000)add('amber','Modelo 720 likely required',`About ${fmt(foreign)} in securities at foreign brokers (Revolut included). Over €50,000 means filing Modelo 720 between 1 Jan and 31 Mar.`);
    if(mo>=10){
      const left=Math.max(0,1500-(+T.pensionYTD||0));
      if(left>0)add('blue','Year-end tax saver: pension plan',`Contributing ${fmt(left)} more before 31 Dec cuts your IRPF by ~${fmt(left*T.marginal/100)} at your ${T.marginal}% marginal rate. Money is locked until retirement (or 10+ years), so only if it fits your plan.`);
      const ty=taxYear(),U=unrealised();
      if(ty.gains>0&&U.loss>0)add('blue','Harvest losses before 31 Dec',`You realised ${fmt(ty.gains)} in gains this year and hold ${fmt(U.loss)} in paper losses. Selling losers offsets gains. Wait 2 months before rebuying the same security or the loss is deferred.`);
    }
  }
  const mp=movePlan();
  if(mp&&mo>=1){
    const U=unrealised();
    if(T.regime!=='uae'&&U.gain>1000)add('violet','Before the UAE move',`You hold ${fmt(U.gain)} in unrealised gains (~${fmt(savingsTax(U.gain,'es'))} Spanish tax if sold now). Realising them in a year you are fully UAE resident could make them tax-free. Plan the date with an advisor.`);
    if(T.regime==='uae'&&U.gain>1000)add('violet','Reset your cost basis before returning',`${fmt(U.gain)} of gains is untaxed while you are UAE resident. Spain taxes the full gain on future sales, so consider selling and rebuying before you become Spanish resident again.`);
  }

  // Habit
  if(s.isCur){const last=S.tx.map(t=>t.date).sort().pop();if(last&&(Date.now()-new Date(last).getTime())/864e5>7)add('blue','Nothing logged for a week','Log recent spending or import a fresh bank CSV.')}
  if(!s.isCur&&s.income>0){const left=s.income-s.spent-s.saved;if(left>20)add('blue',`${fmt(left)} left over from ${monthName(m)}`,'Sweep it into your investment plan before it gets spent.')}

  const order={red:0,amber:1,violet:2,blue:3,green:4};F.sort((a,b)=>order[a.sev]-order[b.sev]);
  const reds=F.filter(f=>f.sev==='red').length,ambers=F.filter(f=>f.sev==='amber').length;
  return{F,s,score:Math.max(0,Math.min(100,100-reds*16-ambers*6))};
}

/* =========================================================
   MARKDOWN (for AI answers)
   ========================================================= */
function md(t){
  const lines=esc(t).split('\n');let h='',inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>');
  for(const l of lines){
    const li=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(li){if(!inList){h+='<ul>';inList=true}h+='<li>'+inl(li[1])+'</li>';continue}
    if(inList){h+='</ul>';inList=false}
    if(/^#{1,2}\s/.test(l))h+='<h3>'+inl(l.replace(/^#+\s/,''))+'</h3>';
    else if(/^#{3,}\s/.test(l))h+='<h4>'+inl(l.replace(/^#+\s/,''))+'</h4>';
    else if(l.trim())h+='<p>'+inl(l)+'</p>';
  }
  if(inList)h+='</ul>';return h;
}

      <div class="kpis"><div class="kpi"><span class="muted small">Needed / month</span><b>${fmt(gp.required)}</b></div><div class="kpi"><span class="muted small">You save / month</span><b>${fmt(W.monthly)}</b></div></div>
      <div class="note">Assumes ${pct(W.blended,1)} a year blended return (core ${G.coreReturn}%, high-risk ${A.aggrReturn}%), cash not growing. Projection at your current pace: <b>${fmt(gp.projected)}</b>. Returns are not guaranteed; markets can fall 30%+ in a bad year.</div>`;
    if(!gp.onTrack){const n=gp.n,r=W.blended/100/12,gap=gp.gap;h+=`<div class="note"><b>Ways to close the ${fmt(gap)}/month gap:</b> cut wants spending by that amount, push the date out, or lower the target. Raising expected returns on paper does not count.</div>`}
  }

  // Allocation

  h+=`<h2>Allocation plan</h2><div class="card">
   <div class="row small"><span><span class="dot" style="display:inline-block;background:var(--accent);margin:0 6px 0 0"></span>Core (S&P 500 / world index)</span><b>${pct(100-W.aggrShare)} <span class="muted">/ ${coreT}%</span></b></div>
   <div class="row small" style="margin-top:6px"><span><span class="dot" style="display:inline-block;background:var(--violet);margin:0 6px 0 0"></span>High-risk (stocks, trading)</span><b>${pct(W.aggrShare)} <span class="muted">/ ${A.aggrPct}%</span></b></div>
   <div class="bar" style="height:12px"><i style="width:${W.value?100-W.aggrShare:coreT}%;border-radius:0"></i><i style="width:${W.value?W.aggrShare:A.aggrPct}%;background:var(--violet);border-radius:0"></i></div>
   ${W.monthly>0?`<div class="note">Of the ~${fmt(W.monthly)} you save each month: put about <b>${fmt(W.monthly*coreT/100)}</b> into the core and <b>${fmt(W.monthly*A.aggrPct/100)}</b> into high-risk, on the same day each month. Buying on a fixed schedule beats trying to time the market for most people.</div>`:''}
   <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b>High-risk income target: ${fmt(A.aggrIncome)}/month</b>
   <div class="note">At ${A.aggrReturn}% a year you need about <b>${fmt(needCap)}</b> in the high-risk bucket (≈${fmt(needCapGross)} to net it after ~21% Spanish tax). You have <b>${fmt(W.aggr)}</b>, which at ${A.aggrReturn}% earns ~${fmt(W.aggr*A.aggrReturn/100/12)}/month on average. Sustained ${A.aggrReturn}% is well above what most active traders achieve; many lose money. Treat this money as money you could lose.</div></div>
   <button class="btn ghost" onclick="editAlloc()">Edit allocation</button></div>`;

  // Holdings
  h+=`<h2>Investments</h2><div class="card">`;
  if(!S.holdings.length)h+=`<div class="muted">Add what you hold (index funds, stocks). Update values monthly, or ask the AI CFO to look up prices.</div>`;

    h+=`<div class="muted small" style="margin:8px 0 2px">${b==='core'?'Core':'High-risk'}</div>`+hs.map(x=>{const g=(+x.value||0)-(+x.cost||0),gp=x.cost?g/x.cost*100:0;return`<div class="tx" onclick="editHolding('${x.id}')"><div class="av" style="background:${b==='core'?'#6a7dff':'#b583ff'}22;border-color:${b==='core'?'#6a7dff':'#b583ff'}44;font-size:12px;font-weight:800;color:${b==='core'?'#9aa8ff':'#d0b0ff'}">${esc((x.ticker||x.name).slice(0,4).toUpperCase())}</div><div class="grow"><div>${esc(x.name)}</div><div class="muted small">cost ${fmt(x.cost)}${x.updated?' · updated '+esc(x.updated):''}</div></div><div class="amt-r"><b>${fmt(x.value)}</b><div class="small ${g>=0?'pos':'neg'}">${g>=0?'+':''}${fmt(g)} (${pct(gp,1)})</div></div></div>`}).join('')}

tax(){
  const T=S.tax,ty=taxYear(),U=unrealised(),mp=movePlan(),y=thisYear();
  let h=`<div class="card"><label style="margin-top:0">Where are you tax resident this year?</label>
  <div class="seg">${Object.entries(REGIMES).map(([k,l])=>`<button class="${T.regime===k?'on':''}" onclick="S.tax.regime='${k}';save();render()">${l}</button>`).join('')}</div>
  <div class="note">${{es:'Spain taxes your worldwide income. Investment income and gains are taxed separately from salary at 19% to 30%.',beckham:'Special inbound regime: salary taxed at a flat 24% (up to €600k). Investment income from outside Spain is generally not taxed in Spain. Lasts the arrival year plus 5 more.',uae:'No personal income tax on salary, dividends, interest or gains. Spain stops taxing you only once you are no longer Spanish resident for the whole calendar year.'}[T.regime]}</div></div>`;

  // Comparison
  const rows=[['Realised gains '+y,ty.gains],['Dividends '+y,ty.div],['Interest '+y,ty.int]];
  h+=`<h2>This year's investment tax</h2><div class="card"><table><tr><th></th><th>Amount</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`).join('')}</table>

  ${Object.entries(REGIMES).map(([k,l])=>`<tr><td>${l}${k===T.regime?' ●':''}</td><td>${fmt(savingsTax(ty.base,k))}</td><td>${fmt(savingsTax(ty.base+U.gain-U.loss,k))}</td></tr>`).join('')}</table>
  <div class="note">Spain 2026 savings scale: 19% to €6k, 21% to €50k, 23% to €200k, 27% to €300k, 30% above. Losses offset gains; unused net losses carry forward 4 years. Beckham column assumes the income is Spanish-source; foreign-source is generally not taxed.</div>
  <div class="grid2"><button class="btn ghost" onclick="editTaxLog()">+ Log gain / dividend</button><button class="btn ghost" onclick="view='wealth';render()">Holdings</button></div>
  ${ty.L.length?`<div style="margin-top:10px">${ty.L.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="tx" onclick="editTaxLog('${t.id}')"><div><div>${esc(t.note||t.type)}</div><div class="muted small">${t.type} · ${t.date}</div></div><b class="${t.amount<0?'neg':''}">${fmt(t.amount)}</b></div>`).join('')}</div>`:''}</div>`;

  // Spain levers
  if(T.regime!=='uae'){
    const left=Math.max(0,1500-(+T.pensionYTD||0));
    h+=`<h2>Spain: legal ways to pay less</h2><div class="card">
    <div class="flag"><div class="ico blue">${SEV_ICON.blue}</div><div><b>Pension plan deduction</b><div class="muted small">Up to €1,500/year of personal contributions reduce your taxable salary (up to €10,000 with an employer plan). At your ~${T.marginal}% marginal rate the remaining ${fmt(left)} would save ~${fmt(left*T.marginal/100)}. Trade-off: locked until retirement or after 10 years; taxed as salary on the way out. It also leaves with you if you move.</div></div></div>
    <div class="flag"><div class="ico blue">${SEV_ICON.blue}</div><div><b>Funds over stocks for rebalancing</b><div class="muted small">Switching between investment funds (fondos de inversión, not ETFs) does not trigger tax in Spain. Selling ETFs or stocks does. Holding the core in a Spanish-registered index fund lets you rebalance tax-free.</div></div></div>
    <div class="flag"><div class="ico blue">${SEV_ICON.blue}</div><div><b>Harvest losses in Q4</b><div class="muted small">Losses on high-risk positions offset gains. Do not rebuy the same security within 2 months or the loss is deferred.</div></div></div>
    <div class="flag"><div class="ico amber">${SEV_ICON.amber}</div><div><b>Foreign assets over €50,000</b><div class="muted small">Securities at foreign brokers (Revolut Securities is Lithuanian) above €50k require Modelo 720 by 31 March. Crypto abroad over €50k: Modelo 721.</div></div></div>
    <label>Your marginal IRPF rate (salary)</label><input type="number" inputmode="decimal" value="${T.marginal}" onchange="S.tax.marginal=num(this.value);save();render()">
    <label>Pension contributions so far in ${y}</label><input type="number" inputmode="decimal" value="${T.pensionYTD||''}" placeholder="0" onchange="S.tax.pensionYTD=num(this.value);save();render()">
    </div>`;
  }

  // Move plan
  h+=`<h2>Spain → UAE → Spain plan</h2><div class="card">
  <div class="grid2"><div><label style="margin-top:0">Move to UAE (month)</label><input type="month" value="${T.moveDate}" onchange="S.tax.moveDate=this.value;save();render()"></div>

  if(mp){
    h+=`<div class="kpis"><div class="kpi"><span class="muted small">First UAE-only tax year</span><b>${mp.firstNR}</b></div><div class="kpi"><span class="muted small">Beckham on return from</span><b>${mp.beckhamYear}</b></div></div>
    ${mp.m>6?`<div class="note neg">Leaving in month ${mp.m} likely means more than 183 days in Spain in ${mp.y}, so you stay Spanish resident (and taxed on everything) for all of ${mp.y}. Leaving by June can make ${mp.y} your first non-resident year.</div>`:''}
    ${mp.ret?`<div class="note">${mp.ret.beckham?`Returning in ${mp.ret.year}: you would have been out 5 full tax years, so you could qualify for Beckham (24% flat on salary for 6 years) if you return for a job.`:`Returning in ${mp.ret.year} is before ${mp.beckhamYear}: you would <b>not</b> qualify for Beckham and go straight back to normal Spanish rates.`}</div>`:''}`;
  }
  h+=`<div class="flag" style="margin-top:12px"><div class="ico violet">${SEV_ICON.violet}</div><div><b>Leaving</b><div class="muted small">Spain decides residency per calendar year: more than 183 days in Spain, or your main business/economic interests there, or spouse and minor children living there. Cut those ties and get a UAE Tax Residency Certificate (183+ days, or 90+ with a residence visa and a home or job). Spain's exit tax only hits very large holdings (shares worth over €4m, or €1m in a company you own 25%+ of).</div></div></div>
  <div class="flag"><div class="ico violet">${SEV_ICON.violet}</div><div><b>While in the UAE</b><div class="muted small">0% personal tax. Watch US dividends: with no US-UAE tax treaty, US stocks withhold 30% (15% from Spain). Prefer accumulating Irish-domiciled ETFs. Spanish-source income (e.g. renting a Spanish flat) is still taxed in Spain.</div></div></div>
  <div class="flag"><div class="ico violet">${SEV_ICON.violet}</div><div><b>Before coming back</b><div class="muted small">Spain taxes gains from your original purchase price, even gains made while you lived in the UAE. Selling and rebuying before you become Spanish resident again resets your cost basis tax-free.</div></div></div>
  <div class="note">This is general information, checked Nov 2026, not tax advice. Rules change; confirm your move with a Spanish tax advisor.</div></div>`;
  return h;
},

function chart(gp){
  const W=gp.W,n=gp.n,w=320,h=120,pad=4,inv=W.invested-W.debt;
  const pts=k=>Array.from({length:n+1},(_,i)=>fv(inv,W.cash,k,W.blended,i));
  const cur=pts(W.monthly),need=pts(gp.required),max=Math.max(+S.goal.target,cur[n],need[n])*1.05,min=Math.min(0,W.nw);
  const X=i=>pad+i/n*(w-2*pad),Y=v=>h-pad-(v-min)/(max-min)*(h-2*pad);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  return`<svg class="chart" viewBox="0 0 ${w} ${h+14}" width="100%" style="margin-top:12px">
  <line x1="${pad}" x2="${w-pad}" y1="${Y(+S.goal.target)}" y2="${Y(+S.goal.target)}" stroke="var(--line)" stroke-dasharray="4 4"/>
  <path d="${path(need)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="${path(cur)}" fill="none" stroke="url(#ng)" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(140,110,255,.6))"/>
  <circle cx="${X(n)}" cy="${Y(cur[n])}" r="3.5" fill="var(--accent)"/>
  <text x="${pad}" y="${h+12}">now</text><text x="${w-pad}" y="${h+12}" text-anchor="end">${monthName(S.goal.date.slice(0,7))}</text>
  <text x="${w-pad}" y="${Y(+S.goal.target)-4}" text-anchor="end">target</text></svg>
  <div class="small muted"><span style="color:var(--accent)">━</span> your current pace · <span>┅</span> pace needed</div>`;
}

function openSheet(html){$('#panel').innerHTML=tr(html);$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
let _ask=null;
function ask(msg,fn){_ask=fn;openSheet(`<div style="font-size:17px;font-weight:600;margin-bottom:6px">Are you sure?</div><div class="muted">${esc(msg)}</div><button class="btn danger" onclick="closeSheet();_ask&&_ask()">Yes, continue</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`)}
const btns=(id,del)=>`<button class="btn" onclick="${id}">Save</button>${del?`<button class="btn danger" onclick="${del}">Delete</button>`:''}<button class="btn ghost" onclick="closeSheet()">Cancel</button>`;

let txType='expense';
function openTx(id){
  const t=id?S.tx.find(x=>x.id===id):null;txType=t?t.type:'expense';
  const opts=S.categories.map(c=>`<option value="${c.id}" ${t&&t.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  openSheet(`<div class="seg"><button id="tE" onclick="setType('expense')">Expense</button><button id="tI" onclick="setType('income')">Income</button></div>
  <label>Amount</label><input class="amt" id="fAmt" type="number" inputmode="decimal" step="0.01" placeholder="0" value="${t?t.amount:''}">
  <div id="catWrap"><label>Category</label><select id="fCat">${t&&!catById()[t.cat]?'<option value="">Uncategorised</option>':''}${opts}</select></div>
  <div class="grid2"><div><label>Date</label><input type="date" id="fDate" value="${t?t.date:(month===thisMonth()?today():month+'-01')}"></div>
  <div><label>Note</label><input id="fNote" placeholder="optional" value="${esc(t?t.note:'')}"></div></div>
  ${btns(`saveTx('${id||''}')`,t?`delTx('${id}')`:'')}`);
  setType(txType);if(!t)setTimeout(()=>$('#fAmt').focus(),80);
}
function setType(t){txType=t;$('#tE').classList.toggle('on',t==='expense');$('#tI').classList.toggle('on',t==='income');$('#catWrap').style.display=t==='income'?'none':''}
function saveTx(id){
  const amount=Math.abs(num($('#fAmt').value));if(!amount)return toast('Enter an amount');
  const rec={type:txType,amount,cat:txType==='income'?null:$('#fCat').value,date:$('#fDate').value||today(),note:$('#fNote').value.trim()};
  if(id)Object.assign(S.tx.find(x=>x.id===id),rec);else S.tx.push({id:uid(),...rec});
  save();closeSheet();month=rec.date.slice(0,7);render();toast(id?'Updated':'Added');
}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);save();closeSheet();render();toast('Deleted')}

function editCat(id){
  const c=id?S.categories.find(x=>x.id===id):null;
  openSheet(`<label style="margin-top:0">Category name</label><input id="cName" value="${esc(c?c.name:'')}">
  <label>Monthly budget</label><input id="cBud" type="number" inputmode="decimal" value="${c&&c.budget?c.budget:''}" placeholder="0">
  <label>Type</label><select id="cKind">${[['need','Need (fixed / essential)'],['want','Want (discretionary)'],['save','Savings & investing']].map(([k,l])=>`<option value="${k}" ${c&&c.kind===k?'selected':''}>${l}</option>`).join('')}</select>
  ${btns(`saveCat('${id||''}')`,c?`delCat('${id}')`:'')}`);
}

    budgets:S.categories.map(c=>({name:c.name,type:c.kind,budget:c.budget})),last6Months:months,

    netWorth:Math.round(W.nw),avgMonthlySaving:Math.round(W.monthly),
    goal:gp?{target:S.goal.target,by:S.goal.date,requiredMonthly:Math.round(gp.required),onTrack:gp.onTrack,assumedReturnPct:+W.blended.toFixed(1)}:'not set',
    allocation:{highRiskTargetPct:S.alloc.aggrPct,highRiskActualPct:+W.aggrShare.toFixed(1),highRiskMonthlyIncomeGoal:S.alloc.aggrIncome,highRiskExpectedReturnPct:S.alloc.aggrReturn,coreExpectedReturnPct:S.goal.coreReturn},
    tax:{currentResidence:REGIMES[S.tax.regime],marginalSalaryRatePct:S.tax.marginal,pensionContribThisYear:S.tax.pensionYTD,realisedThisYear:{gains:ty.gains,dividends:ty.div,interest:ty.int},unrealisedGains:Math.round(U.gain),unrealisedLosses:Math.round(U.loss),
      plan:mp?{moveToUAE:S.tax.moveDate,returnToSpain:S.tax.returnDate||'undecided',firstNonResidentYear:mp.firstNR,beckhamEligibleFromYear:mp.beckhamYear}:'no move planned'}};
  let tx='';
  if(S.ai.allowTx){const from=iso(new Date(Date.now()-90*864e5));tx=S.tx.filter(t=>t.date>=from).sort((a,b)=>a.date.localeCompare(b.date)).slice(-500).map(t=>`${t.date}|${t.type==='income'?'+':'-'}${t.amount}|${t.type==='income'?'income':(C[t.cat]?.name||'Uncategorised')}|${(t.note||'').slice(0,40)}`).join('\n')}

const SYSTEM=`You are the user's personal CFO inside their "Life CFO" app. The user is tax resident in Spain (Alicante area), is considering moving to the UAE and probably returning to Spain later. They invest in a core S&P 500 / index bucket aiming for ~8-10% a year and a smaller high-risk bucket (individual stocks, trading) aiming to make a few hundred euros a month.

How to behave:
- Be direct and specific, like a sharp CFO talking to the CEO. Lead with the answer, then the numbers behind it. Use their actual figures.
- Flag problems plainly (overspending, risk concentration, unrealistic return expectations, tax mistakes). Don't flatter.
- For "should I buy X / is now a good time": search the web for current price, valuation, recent news and analyst context, then give a balanced view: bull case, bear case, how it fits their allocation and risk budget, position size you'd consider reasonable. Be honest that nobody can reliably time markets and that you are not a licensed financial advisor. Never present a trade as a sure thing.
- For tax: use Spanish and UAE rules (Spain 2026 savings scale 19/21/23/27/30%; Beckham requires 5 prior non-resident tax years; UAE 0% personal tax; Spain residency is per calendar year). Search to confirm anything that may have changed. Recommend confirming big decisions with a tax advisor.
- You can change the user's data only through the <data> block described in their message; the app asks them to confirm. Never claim something is saved.
- Keep answers under ~250 words unless asked for depth. Use short headings and bullets. Amounts in their currency. Never use em dashes.`;
let aiBusy=false;
async function callClaude(messages,{web=S.ai.web,maxTokens=1600,system=SYSTEM}={}){
  if(ES_LANG())system+='\n\nIMPORTANT: Always write your answer in Spanish (Spain), using euros and Spanish number formatting. Keep JSON keys and category names exactly as given, in English.';
  if(!S.ai.key)throw new Error('Add your Claude API key first (AI CFO tab or Settings).');
  if(!navigator.onLine)throw new Error('You are offline. AI features need internet; everything else works offline.');
  const body={model:S.ai.model,max_tokens:maxTokens,system,messages};
  if(web)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:4}];
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j?.error?.message||('API error '+r.status));
  return(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
}

async function aiCategorise(){

    const arr=JSON.parse(out.slice(out.indexOf('['),out.lastIndexOf(']')+1));

}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',.85);return{data:d.split(',')[1],url:d}}
  finally{URL.revokeObjectURL(url)}
}

2) If there is financial data worth recording, add it AFTER your reply inside <data></data>.

Extra rules for images: a receipt is ONE expense with the total; a list of bank transactions is one entry per row; skip pending, declined and internal transfers between own accounts; monthlyIncome only from a payslip (net pay). Only include what is clearly visible. If there is nothing to record, leave out the <data> block.`;
  try{
    const content=[...imgs.map(i=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:i.data}})),{type:'text',text:aiContext()+'\n\n'+instr+'\n\nUser note: '+label}];
    const out=await callClaude([{role:'user',content}],{web:false,maxTokens:4000});
    const{reply,data,n}=parseData(out);
    S.ai.chat.push({role:'assistant',content:(reply||'Done.')+(n?(ES_LANG()?`\n\n**He encontrado ${n} elemento${n>1?'s':''} para añadir.** Revísalos antes de guardarlos.`:`\n\n**Found ${n} item${n>1?'s':''} to add.** Review them before they are saved.`):'')});S.ai.chat=S.ai.chat.slice(-40);save();
    aiBusy=false;render();if(n)openReview(data);
  }catch(e){S.ai.chat.push({role:'assistant',content:'⚠️ '+e.message});save();aiBusy=false;render()}
}
function parseData(out){
  const m=out.match(/<data>([\s\S]*?)<\/data>/),reply=out.replace(/<data>[\s\S]*?<\/data>/g,'').replace(/<\/?data>/g,'').trim();
  let data=null;if(m){try{const j=m[1];data=JSON.parse(j.slice(j.indexOf('{'),j.lastIndexOf('}')+1))}catch(e){}}
  const n=data?(data.transactions||[]).length+(data.accounts||[]).length+(data.holdings||[]).length+(data.budgets||[]).length+(data.goal&&+data.goal.target?1:0)+(+data.monthlyIncome>0?1:0):0;
  return{reply,data,n};
}
function openReview(d){
  const C=S.categories,byName=Object.fromEntries(C.map(c=>[c.name.toLowerCase(),c.id])),other=byName['other']||C[0].id;
  const seen=new Set(S.tx.map(t=>t.date+'|'+(+t.amount).toFixed(2)));
  RV={tx:(d.transactions||[]).filter(t=>+t.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')).map(t=>({...t,amount:Math.round(Math.abs(+t.amount)*100)/100,type:t.type==='income'?'income':'expense',cat:byName[(t.category||'').toLowerCase()]||other,dup:seen.has(t.date+'|'+Math.abs(+t.amount).toFixed(2))})),
      acc:(d.accounts||[]).filter(a=>a.name&&isFinite(+a.balance)),hold:(d.holdings||[]).filter(h=>h.name&&isFinite(+h.value)),income:+d.monthlyIncome>0?+d.monthlyIncome:null,
      bud:(d.budgets||[]).map(b=>({...b,c:C.find(c=>c.name.toLowerCase()===String(b.category||'').toLowerCase())})).filter(b=>b.c&&isFinite(+b.budget)),
      goal:d.goal&&+d.goal.target>0&&/^\d{4}-\d{2}/.test(d.goal.date||'')?{target:+d.goal.target,date:d.goal.date.slice(0,7)}:null};
  const accEx=a=>S.accounts.find(x=>x.name.toLowerCase()===a.name.toLowerCase());
  const holEx=h=>S.holdings.find(x=>(h.ticker&&x.ticker&&x.ticker.toUpperCase()===String(h.ticker).toUpperCase())||x.name.toLowerCase()===h.name.toLowerCase());
  const catSel=(t,i)=>t.type==='income'?'':`<select id="rv_c${i}">${C.map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
  let h=`<div style="font-size:19px;font-weight:750;letter-spacing:-.3px">Review before saving</div><div class="note" style="margin-top:4px">Untick anything that's wrong. Possible duplicates are unticked.</div>`;
  if(RV.tx.length)h+=`<h2 style="margin-top:16px">Transactions</h2>`+RV.tx.map((t,i)=>`<div class="rv"><input type="checkbox" id="rv_t${i}" ${t.dup?'':'checked'}>${av(C.find(c=>c.id===t.cat)?.name,t.type==='income')}<div class="grow"><div class="row"><b style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.description||'')}</b><b class="${t.type==='income'?'pos':''}" style="white-space:nowrap">${t.type==='income'?'+':'−'}${fmt(t.amount,2)}</b></div><div class="muted small">${t.date}${t.dup?' · <span style="color:var(--amber)">possible duplicate</span>':''}</div>${catSel(t,i)}</div></div>`).join('');
  if(RV.acc.length)h+=`<h2>Account balances</h2>`+RV.acc.map((a,i)=>`<div class="rv"><input type="checkbox" id="rv_a${i}" checked><div class="grow"><div class="row"><b style="font-weight:600">${esc(a.name)}</b><b>${fmt(+a.balance,2)}</b></div><div class="muted small">${esc(a.type||'cash')} · ${accEx(a)?'updates existing account':'new account'}</div></div></div>`).join('');
  if(RV.hold.length)h+=`<h2>Investments</h2>`+RV.hold.map((x,i)=>`<div class="rv"><input type="checkbox" id="rv_h${i}" checked><div class="grow"><div class="row"><b style="font-weight:600">${esc(x.name)} ${x.ticker?`<span class="pill">${esc(x.ticker)}</span>`:''}</b><b>${fmt(+x.value)}</b></div><div class="muted small">${x.bucket==='aggr'?'High-risk':'Core'}${x.cost?' · cost '+fmt(+x.cost):''} · ${holEx(x)?'updates existing':'new holding'}</div></div></div>`).join('');
  if(RV.bud.length)h+=`<h2>Budgets</h2>`+RV.bud.map((b,i)=>`<div class="rv"><input type="checkbox" id="rv_b${i}" checked>${av(b.c.name)}<div class="grow"><div class="row"><b style="font-weight:600">${esc(b.c.name)}</b><b>${fmt(+b.budget)}</b></div><div class="muted small">${fmt(b.c.budget||0)} → ${fmt(+b.budget)}</div></div></div>`).join('');
  if(RV.goal)h+=`<h2>Net worth goal</h2><div class="rv"><input type="checkbox" id="rv_g" checked><div class="grow"><div class="row"><b style="font-weight:600">${fmt(RV.goal.target)}</b><b>${monthName(RV.goal.date)}</b></div></div></div>`;
  if(RV.income)h+=`<h2>Income</h2><div class="rv"><input type="checkbox" id="rv_inc" checked><div class="grow"><b style="font-weight:600">Set monthly take-home pay to ${fmt(RV.income)}</b><div class="muted small">Currently ${fmt(S.settings.income)}</div></div></div>`;
  h+=`<button class="btn" onclick="applyReview()">Save selected</button><button class="btn ghost" onclick="closeSheet()">Discard</button>`;
  openSheet(h);
}
function applyReview(){
  if(!RV)return;let n=0;const d=today();
  RV.tx.forEach((t,i)=>{if(!$('#rv_t'+i)?.checked)return;const sel=$('#rv_c'+i);S.tx.push({id:uid(),type:t.type,amount:t.amount,cat:t.type==='income'?null:(sel?sel.value:t.cat),date:t.date,note:t.description||'',src:'image'});n++});
  RV.acc.forEach((a,i)=>{if(!$('#rv_a'+i)?.checked)return;const ty=['cash','savings','invest','debt'].includes(a.type)?a.type:'cash',ex=S.accounts.find(x=>x.name.toLowerCase()===a.name.toLowerCase());
    if(ex)Object.assign(ex,{balance:Math.abs(+a.balance),updated:d});else S.accounts.push({id:uid(),name:a.name,type:ty,balance:Math.abs(+a.balance),rate:0,updated:d});n++});
  RV.hold.forEach((x,i)=>{if(!$('#rv_h'+i)?.checked)return;const ex=S.holdings.find(h=>(x.ticker&&h.ticker&&h.ticker.toUpperCase()===String(x.ticker).toUpperCase())||h.name.toLowerCase()===x.name.toLowerCase());
    if(ex){ex.value=+x.value;if(+x.cost)ex.cost=+x.cost;ex.updated=d}else S.holdings.push({id:uid(),name:x.name,ticker:String(x.ticker||'').toUpperCase(),bucket:x.bucket==='aggr'?'aggr':'core',value:+x.value,cost:+x.cost||+x.value,foreign:true,updated:d});n++});
  RV.bud.forEach((b,i)=>{if(!$('#rv_b'+i)?.checked)return;b.c.budget=Math.abs(+b.budget);n++});
  if(RV.goal&&$('#rv_g')?.checked){S.goal.target=RV.goal.target;S.goal.date=RV.goal.date;n++}
  if(RV.income&&$('#rv_inc')?.checked){S.settings.income=RV.income;n++}
  RV=null;save();closeSheet();render();toast(`Saved ${n} item${n===1?'':'s'}`);
}

   IMPORT / EXPORT
   ========================================================= */
function parseCSV(text){
  const first=text.split(/\r?\n/)[0],d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function parseAmount(v){let s=String(v).replace(/[^\d,.\-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');return parseFloat(s)||0}
function parseDate(v){v=String(v).trim();let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null}
function ruleCat(desc){
  const d=desc.toLowerCase(),byName=Object.fromEntries(S.categories.map(c=>[c.name.toLowerCase(),c.id]));
  for(const line of S.rules.split('\n')){if(!line.includes('=')||line.trim().startsWith('#'))continue;const[k,c]=line.split('=').map(x=>x.trim().toLowerCase());
    if(k&&new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])').test(d)&&byName[c])return byName[c]}
  return byName['other']||null;
}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return toast('That file looks empty');
  const H=rows[0].map(h=>h.trim().toLowerCase()),find=(...n)=>{for(const x of n){const i=H.indexOf(x);if(i>=0)return i}for(const x of n){const i=H.findIndex(h=>h.includes(x));if(i>=0)return i}return -1};
  const iD=find('completed date','started date','date','fecha','fecha valor'),iA=find('amount','importe','cantidad'),iT=find('description','concepto','descripción','descripcion','merchant'),iS=find('state','estado'),iF=find('fee','comisión','comision'),iType=find('type','tipo');
  if(iD<0||iA<0)return toast('Could not find date/amount columns');
  const seen=new Set(S.tx.map(t=>t.date+'|'+t.amount.toFixed(2)+'|'+(t.note||'').toLowerCase()));
  let added=0,dup=0,skip=0;
  for(const r of rows.slice(1)){
    if(iS>=0&&r[iS]&&!/completed|completado/i.test(r[iS])){skip++;continue}
    if(iType>=0&&/^exchange$/i.test((r[iType]||'').trim())){skip++;continue}
    const date=parseDate(r[iD]);let amt=parseAmount(r[iA]);if(iF>=0)amt-=Math.abs(parseAmount(r[iF]||0));
    if(!date||!amt){skip++;continue}
    const note=(iT>=0?r[iT]:'').trim(),type=amt<0?'expense':'income',amount=Math.round(Math.abs(amt)*100)/100;
    const key=date+'|'+amount.toFixed(2)+'|'+note.toLowerCase();if(seen.has(key)){dup++;continue}seen.add(key);
    S.tx.push({id:uid(),type,amount,cat:type==='expense'?ruleCat(note):null,date,note,src:'csv'});added++;
  }
  save();render();toast(`Imported ${added} · ${dup} duplicates · ${skip} skipped`);
}
async function exportJSON(){
  const data={...S,ai:{...S.ai,key:''}};
  const name=`life-cfo-backup-${today()}.json`,blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Life CFO backup'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function readFile(input,cb){input.addEventListener('change',()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cb(r.result);input.value=''};r.readAsText(f)})}
readFile($('#fileCSV'),importCSV);
readFile($('#fileJSON'),txt=>{try{const d=JSON.parse(txt);if(!d.categories)throw 0;ask('Replace the data on this device with this backup?',()=>{const key=S.ai.key;S=migrate(d);S.ai.key=key;save();render();toast('Backup restored')})}catch(e){toast('Not a valid backup file')}});
